<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Timetable</title>

<style>
body{
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background:#1f1f2e;
    color:white;
    padding:20px;
}

.card{
    background:#2c3e50;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<h1>Class Timetable</h1>
<div id="timetable"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCo-qqxxAAaDss7fmj5eYQGS1lN3DepQBE",
  authDomain: "nmims-timetable.firebaseapp.com",
  databaseURL: "https://nmims-timetable-default-rtdb.firebaseio.com",
  projectId: "nmims-timetable",
  storageBucket: "nmims-timetable.firebasestorage.app",
  messagingSenderId: "560553279585",
  appId: "1:560553279585:web:fb97228e1f54a93aa16a20"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const container = document.getElementById("timetable");

db.ref("timetable").on("value", function(snapshot) {
    const data = snapshot.val();
    container.innerHTML = "";

    if (!data) return;

    for (let day in data) {

        const dayTitle = document.createElement("h2");
        dayTitle.innerText = day.toUpperCase();
        container.appendChild(dayTitle);

        for (let item in data[day]) {

            const card = document.createElement("div");
            card.className = "card";

            const lesson = data[day][item];

            card.innerHTML = `
                <strong>${lesson.time || ""}</strong><br>
                ${lesson.subject || ""}
            `;

            container.appendChild(card);
        }
    }
});
</script>

</body>
</html>
